pip install pygrib numpy pandas requests scikit-learn

name: Build Tornado Training Dataset

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_dataset:
    runs-on: ubuntu-latest

    steps:

      # ----------------------------
      # 1. Checkout repo
      # ----------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # ----------------------------
      # 2. Setup Python
      # ----------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ----------------------------
      # 3. Install system dependencies
      # ----------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev

      # ----------------------------
      # 4. Install Python packages
      # ----------------------------
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pygrib numpy pandas requests

      # ----------------------------
      # 5. Show existing files
      # ----------------------------
      - name: Check data folder
        run: |
          echo "Before generation:"
          ls -l map/data || true

      # ----------------------------
      # 6. Run Logistic Regression
      # ----------------------------
      - name: Run Logistic Regression
        run: |
          python scripts/train_lr_model.py

      # ----------------------------
      # 8. Verify files exist
      # ----------------------------
      - name: Verify datasets
        run: |
          echo "After generation:"
          ls -l map/data

      # ----------------------------
      # 9. Commit datasets
      # ----------------------------
      - name: Commit and push datasets
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add map/data/*.csv

          git commit -m "Auto update RAP training datasets" || echo "Nothing to commit"

          git push
