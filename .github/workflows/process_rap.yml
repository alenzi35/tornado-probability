name: Build Tornado Training Dataset

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_dataset:
    runs-on: ubuntu-latest

    steps:

      # ----------------------------
      # 1. Checkout repo
      # ----------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # ----------------------------
      # 2. Setup Python
      # ----------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ----------------------------
      # 3. Install system dependencies
      # ----------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev

      # ----------------------------
      # 4. Install Python packages
      # ----------------------------
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pygrib numpy pandas requests

      # ----------------------------
      # 5. Debug CSV presence (optional but recommended)
      # ----------------------------
      - name: Check CSV
        run: |
          echo "Listing map/data contents:"
          ls -l map/data

      # ----------------------------
      # 6. Build dataset
      # ----------------------------
      - name: Build tornado dataset
        run: |
          python scripts/build_unified_dataset.py

      # ----------------------------
      # 7. Commit dataset
      # ----------------------------
      - name: Commit and push dataset
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add map/data/rap_unified_dataset.json

          git commit -m "Auto update tornado training dataset" || echo "Nothing to commit"

          git push
