name: Generate Tornado Probability Map

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run_process_rap:
    runs-on: ubuntu-latest

    steps:

      # ----------------------------
      # 1. Checkout repo
      # ----------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # ----------------------------
      # 2. Setup Python
      # ----------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ----------------------------
      # 3. Install system dependencies
      # ----------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libeccodes-dev \
            gdal-bin \
            libgdal-dev \
            libproj-dev \
            proj-data \
            proj-bin

      # ----------------------------
      # 4. Install Python packages
      # ----------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            pygrib \
            numpy \
            requests \
            geopandas \
            shapely \
            pyproj \
            fiona

          echo "Installed packages:"
          python -m pip list

      # ----------------------------
      # 5. Run RAP processing (ONLY THIS)
      # ----------------------------
      - name: Run process_rap.py
        run: |
          python scripts/process_rap.py

      # ----------------------------
      # 6. Verify output
      # ----------------------------
      - name: Check output
        run: |
          ls -l map/data || true

      # ----------------------------
      # 7. Commit updated map data
      # ----------------------------
      - name: Commit and push output
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add map/data/tornado_prob_lcc.json

          git commit -m "Update tornado probability map" || echo "Nothing to commit"

          git push
