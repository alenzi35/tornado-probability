name: Process RAP Tornado Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"   # Every 5 minutes (polling)

permissions:
  contents: write

jobs:
  process_rap:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libeccodes-dev \
            gdal-bin \
            libgdal-dev

          pip install --upgrade pip

          pip install \
            pygrib \
            numpy \
            pyproj \
            shapely \
            requests

      # 4. Process RAP
      - name: Process RAP data
        run: |
          python scripts/process_rap.py

      # 5. Borders
      - name: Convert borders
        run: |
          python scripts/convert_borders_to_lcc.py

      # 6. Commit
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add map/data

          git commit -m "Auto RAP update" || echo "No changes"

          git push
