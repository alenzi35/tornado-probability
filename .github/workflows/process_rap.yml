name: Process RAP Tornado Data

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # Changed to :17 to avoid 'top-of-hour' congestion that drops jobs
    - cron: '33 * * * *'

permissions:
  contents: write

jobs:
  process_rap:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Fetch all history so rebase can work correctly
          fetch-depth: 0

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install system + Python deps
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev gdal-bin libgdal-dev
          pip install --upgrade pip
          pip install pygrib numpy xarray geopandas pyproj shapely fiona requests

      # 4. Run RAP processor
      - name: Process RAP data
        run: python scripts/process_rap.py

      # 5. Convert borders to LCC
      - name: Convert borders to LCC
        run: python scripts/convert_borders_to_lcc.py

      # 6. Commit + push outputs
      - name: Commit and push data
        run: |
          # Use official GitHub Actions Bot credentials
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage specific output files
          git add \
            map/data/tornado_prob.json \
            map/data/tornado_prob_lcc.json \
            map/data/borders_lcc.json

          # Commit only if changes exist; [skip ci] prevents recursive loops
          git commit -m "Update RAP + LCC borders [skip ci]" || echo "Nothing to commit"

          # Pull latest changes from remote to fix 'fetch first' error
          git pull --rebase origin main
          
          # Push the merged changes
          git push origin main
