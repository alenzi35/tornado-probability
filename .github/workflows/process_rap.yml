name: Build Tornado Training Dataset

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_dataset:
    runs-on: ubuntu-latest

    steps:

      # ----------------------------
      # 1. Checkout repo
      # ----------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # ----------------------------
      # 2. Setup Python
      # ----------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ----------------------------
      # 3. Install system dependencies
      # ----------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev

      # ----------------------------
      # 4. Install Python packages
      # ----------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pygrib \
            numpy \
            pandas \
            requests \
            scikit-learn

          echo "Installed packages:"
          python -m pip list

      # ----------------------------
      # 5. Check files
      # ----------------------------
      - name: Check data folder
        run: |
          echo "Before training:"
          ls -l map/data || true

      # ----------------------------
      # 6. Run Logistic Regression
      # ----------------------------
      - name: Train Logistic Regression
        run: |
          python scripts/process.rap.py

      # ----------------------------
      # 7. Verify outputs
      # ----------------------------
      - name: Verify outputs
        run: |
          echo "After training:"
          ls -l map/data

      # ----------------------------
      # 8. Commit (optional)
      # ----------------------------
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add map/data/* || true

          git commit -m "Update training results" || echo "Nothing to commit"

          git push
