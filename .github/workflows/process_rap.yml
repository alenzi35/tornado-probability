name: Process RAP Tornado Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_probability_map:
    runs-on: ubuntu-latest

    steps:

      # ----------------------------
      # 1. Checkout Repo
      # ----------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # ----------------------------
      # 2. Setup Python
      # ----------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ----------------------------
      # 3. Install System Dependencies
      # ----------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libeccodes-dev \
            gdal-bin \
            libgdal-dev \
            libproj-dev \
            proj-data \
            proj-bin

      # ----------------------------
      # 4. Install Python Dependencies
      # ----------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            pygrib \
            numpy \
            requests \
            geopandas \
            shapely \
            pyproj \
            fiona

      # ----------------------------
      # 5. Debug Existing Output Folder
      # ----------------------------
      - name: Check map/data folder
        run: |
          ls -l map/data || true

      # ----------------------------
      # 6. Run RAP Processing / ML Inference
      # ----------------------------
      - name: Generate Tornado Probability Map
        run: |
          python scripts/train_lr_model.py

      # ----------------------------
      # 7. Verify Output
      # ----------------------------
      - name: Verify Output
        run: |
          ls -l map/data
          test -f map/data/tornado_prob_lcc.json

      # ----------------------------
      # 8. Commit Updated Map
      # ----------------------------
      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add map/data/tornado_prob_lcc.json

          git commit -m "Auto update tornado probability map" || echo "Nothing to commit"

          git push
