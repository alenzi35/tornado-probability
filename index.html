<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tornado Probability Grid</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        text-align: center;
    }

    table {
        border-collapse: collapse;
        margin: 20px auto;
    }

    td {
        width: 60px;
        height: 40px;
        border: 1px solid #ccc;
        font-size: 14px;
        font-weight: bold;
    }

    /* Fixed colour classes */
    .white-cell {
        background-color: #ffffff;
        color: #000000;
    }

    .green-cell {
        background-color: #008000;
        color: #ffffff;
    }

    .brown-cell {
        background-color: #8B4513;
        color: #ffffff;
    }

    .yellow-cell {
        background-color: #FFFF00;
        color: #000000;
    }
</style>
</head>

<body>

<h2>Tornado Probability Grid</h2>

<table id="probabilityTable">
    <tbody>
        <tr>
            <td>0.25</td>
            <td>0.65</td>
            <td>1.45</td>
            <td>2.30</td>
        </tr>
    </tbody>
</table>

<script>
function applyColors() {
    const cells = document.querySelectorAll("#probabilityTable td");

    cells.forEach(cell => {
        let value = parseFloat(cell.textContent);

        cell.classList.remove("white-cell", "green-cell", "brown-cell", "yellow-cell");

        if (isNaN(value)) return;

        if (value < 0.4) {
            cell.classList.add("white-cell");
        } else if (value < 1) {
            cell.classList.add("green-cell");
        } else if (value < 2) {
            cell.classList.add("brown-cell");
        } else {
            cell.classList.add("yellow-cell");
        }
    });
}

// Ensure it runs AFTER everything is loaded
window.addEventListener("load", function() {
    applyColors();
});
</script>

</body>
</html>
