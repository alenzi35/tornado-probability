<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tornado Probability Grid</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        text-align: center;
    }

    table {
        border-collapse: collapse;
        margin: 20px auto;
    }

    td {
        width: 60px;
        height: 40px;
        border: 1px solid #ccc;
        font-size: 14px;
        font-weight: bold;
    }

    /* Fixed colour classes */
    .white-cell {
        background-color: white;
        color: black;
    }

    .green-cell {
        background-color: green;
        color: white;
    }

    .brown-cell {
        background-color: brown;
        color: white;
    }

    .yellow-cell {
        background-color: yellow;
        color: black;
    }
</style>
</head>

<body>

<h2>Tornado Probability Grid</h2>

<table id="probabilityTable">
    <tbody>
        <!-- Your JSON will populate rows here -->
    </tbody>
</table>

<script>
// ---- COLOR LOGIC FUNCTION ----
function applyColors() {
    const cells = document.querySelectorAll("#probabilityTable td");

    cells.forEach(cell => {
        let value = parseFloat(cell.textContent);

        // Remove existing classes
        cell.classList.remove("white-cell", "green-cell", "brown-cell", "yellow-cell");

        if (isNaN(value)) return;

        // Fixed color thresholds in decimal (0.4% = 0.004)
        if (value < 0.004) {          // <0.4%
            cell.classList.add("white-cell");
        } else if (value < 0.01) {    // 0.4% - 1%
            cell.classList.add("green-cell");
        } else if (value < 0.02) {    // 1% - 2%
            cell.classList.add("brown-cell");
        } else {                      // >= 2%
            cell.classList.add("yellow-cell");
        }
    });
}

// ---- JSON POPULATION FUNCTION (EXAMPLE) ----
function populateTableFromJSON(data) {
    const tbody = document.querySelector("#probabilityTable tbody");
    tbody.innerHTML = ""; // Clear old rows

    data.forEach(row => {
        const tr = document.createElement("tr");
        row.forEach(value => {
            const td = document.createElement("td");
            td.textContent = value;
            tr.appendChild(td);
        });
        tbody.appendChild(tr);
    });

    // Apply colors AFTER JSON populates the table
    applyColors();
}

// ---- EXAMPLE JSON DATA (Replace with your actual JSON source) ----
const exampleData = [
    [0.0025, 0.0065, 0.0145, 0.023],
    [0.0005, 0.008, 0.012, 0.025]
];

// Populate table with example data on load
populateTableFromJSON(exampleData);
</script>

</body>
</html>
