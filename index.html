<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LCC Tornado Probability Map</title>

<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
  }

  canvas {
    display: block;
  }

  /* Forecast text (minimal overlay, no box) */
  #forecastInfo {
    position: absolute;
    top: 10px;
    left: 10px;
    color: rgba(255,255,255,0.85);
    font-size: 12px;
    line-height: 1.4;
    z-index: 10;
    text-shadow: 0 0 2px black;
    pointer-events: none;
  }

  /* Tooltip (sharp, utilitarian) */
  #tooltip {
    position: absolute;
    padding: 6px 8px;
    background: rgba(0,0,0,0.95);
    color: white;
    border: 1px solid rgba(255,255,255,0.2);
    pointer-events: none;
    display: none;
    font-size: 12px;
    white-space: nowrap;
  }

  /* Legend (simple text, no box UI feel) */
  #legend {
    position: absolute;
    bottom: 10px;
    left: 10px;
    font-size: 11px;
    color: rgba(255,255,255,0.7);
    line-height: 1.5;
    z-index: 10;
    pointer-events: none;
  }

  /* Loading screen */
  #loading {
    position: absolute;
    inset: 0;
    background: #000;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    font-size: 14px;
  }
</style>
</head>

<body>

<div id="loading">Loading tornado probability data…</div>

<div id="forecastInfo">Loading forecast…</div>
<div id="legend">
  WHITE &lt; 0.1%<br>
  GREEN 0.1–1%<br>
  BROWN 1–2%<br>
  YELLOW &gt; 2%
</div>

<canvas id="mapCanvas"></canvas>
<div id="tooltip"></div>

<script>

const canvas = document.getElementById("mapCanvas");
const ctx = canvas.getContext("2d");
const tooltip = document.getElementById("tooltip");
const infoBox = document.getElementById("forecastInfo");
const loading = document.getElementById("loading");

let scale = 1;
let offsetX = 0;
let offsetY = 0;

let dragging = false;
let lastX, lastY;

let cells = [];
let borders = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

/* LOAD BORDERS */
fetch("map/data/borders_lcc.json")
  .then(r => r.json())
  .then(data => {
    borders = data.features;
    fitView();
    draw();
  });

/* LOAD PROBABILITY DATA */
fetch("map/data/tornado_prob_lcc.json")
  .then(r => r.json())
  .then(data => {

    cells = data.features;

    const runDate = data.run_date;
    const runHour = parseInt(data.run_hour, 10);
    const fcst = data.forecast;

    const fcstHour = runHour + 1;
    const validStart = fcstHour % 24;
    const validEnd = (fcstHour + 1) % 24;

    function pad(n){ return n.toString().padStart(2,"0"); }

    infoBox.innerHTML =
      `Run: ${runDate} ${pad(runHour)}Z (${fcst})<br>
       Valid: ${pad(validStart)}:00-${pad(validEnd)}:00 UTC`;

    loading.style.display = "none";

    fitView();
    draw();
  });

function probToColor(p) {
  if (p < 0.001) return 'white';
  else if (p <= 0.01) return 'green';
  else if (p <= 0.02) return 'brown';
  else return 'yellow';
}

function fitView() {

  if (cells.length === 0) return;

  let minX=Infinity,maxX=-Infinity;
  let minY=Infinity,maxY=-Infinity;

  cells.forEach(c=>{
    minX=Math.min(minX,c.x);
    maxX=Math.max(maxX,c.x+c.dx);
    minY=Math.min(minY,c.y);
    maxY=Math.max(maxY,c.y+c.dy);
  });

  borders.forEach(line=>{
    line.forEach(([x,y])=>{
      minX=Math.min(minX,x);
      maxX=Math.max(maxX,x);
      minY=Math.min(minY,y);
      maxY=Math.max(maxY,y);
    });
  });

  const rx=maxX-minX;
  const ry=maxY-minY;

  scale=Math.min(canvas.width/rx,canvas.height/ry)*0.9;

  offsetX=canvas.width/2-(minX+rx/2)*scale;
  offsetY=canvas.height/2+(minY+ry/2)*scale;
}

function draw(){

  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.setTransform(scale,0,0,-scale,offsetX,offsetY);

  /* cells */
  cells.forEach(c=>{
    ctx.fillStyle = probToColor(c.prob);
    ctx.fillRect(c.x,c.y,c.dx,c.dy);
  });

  /* borders */
  ctx.strokeStyle = "rgba(255,255,255,0.6)";
  ctx.lineWidth = 1/scale;

  ctx.beginPath();

  borders.forEach(line=>{
    line.forEach(([x,y],i)=>{
      if(i===0) ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    });
  });

  ctx.stroke();
}

function screenToLCC(px,py){
  return {
    x:(px-offsetX)/scale,
    y:-(py-offsetY)/scale
  };
}

/* TOOLTIP */
canvas.addEventListener("mousemove", e => {

  const {x, y} = screenToLCC(e.offsetX, e.offsetY);

  let hit = null;

  for (const c of cells) {
    if (x >= c.x && x <= c.x + c.dx && y >= c.y && y <= c.y + c.dy) {
      hit = c;
      break;
    }
  }

  if (hit) {

    tooltip.style.display = "block";
    tooltip.style.left = (e.pageX + 12) + "px";
    tooltip.style.top = (e.pageY + 12) + "px";

    tooltip.innerHTML =
`<b>${(hit.prob * 100).toFixed(3)}%</b><br>
CAPE: ${hit.cape || 0}<br>
CIN: ${hit.cin || 0}<br>
SRH: ${hit.hlcy || 0}<br>
LCL: ${hit.lcl || 0}<br>
Shear: ${hit.shear || 0}`;

  } else {
    tooltip.style.display = "none";
  }

});

/* ZOOM */
canvas.addEventListener("wheel", e => {
  e.preventDefault();

  const z = e.deltaY < 0 ? 1.15 : 0.87;

  offsetX = e.offsetX - z * (e.offsetX - offsetX);
  offsetY = e.offsetY - z * (e.offsetY - offsetY);

  scale *= z;
  draw();
});

/* PAN */
canvas.addEventListener("mousedown", e => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});

window.addEventListener("mouseup", () => dragging = false);

window.addEventListener("mousemove", e => {
  if (!dragging) return;

  offsetX += e.clientX - lastX;
  offsetY += e.clientY - lastY;

  lastX = e.clientX;
  lastY = e.clientY;

  draw();
});

</script>

</body>
</html>
