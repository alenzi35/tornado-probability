<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tornado Probability Map</title>

<style>
html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: #111;
  font-family: sans-serif;
}

/* NAVBAR */
header {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 60px;

  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 0 24px;
  background: rgba(0,0,0,0.25);
  backdrop-filter: blur(8px);

  z-index: 1000;
  box-sizing: border-box;
}

.logo {
  color: white;
  font-size: 16px;
  font-weight: 600;
}

nav {
  display: flex;
  gap: 24px;
}

nav a {
  color: white;
  text-decoration: none;
  font-size: 14px;
  opacity: 0.9;
}

nav a:hover { opacity: 1; }

/* MAP */
#hero {
  position: relative;
  height: 100vh;
  overflow: hidden;
}

canvas { display: block; }

/* TOOLTIP */
#tooltip {
  position: absolute;
  padding: 6px 10px;
  background: rgba(0,0,0,0.85);
  color: white;
  border-radius: 5px;
  pointer-events: none;
  display: none;
  font-size: 13px;
  white-space: nowrap;
  z-index: 100;
}

/* INFO BOX */
#forecastInfo {
  position: absolute;
  top: 10px;
  left: 10px;
  padding: 8px 12px;
  background: rgba(0,0,0,0.7);
  color: white;
  font-size: 13px;
  border-radius: 6px;
  z-index: 10;
}
</style>
</head>

<body>

<header>
  <div class="logo">Tornado Probability Mapping System</div>
  <nav>
    <a href="#about">About</a>
    <a href="#methodology">Methodology</a>
    <a href="#faq">FAQ</a>
  </nav>
</header>

<section id="hero">
  <canvas id="mapCanvas"></canvas>
  <div id="tooltip"></div>
  <div id="forecastInfo">Loading forecast…</div>
</section>

<script>

const canvas = document.getElementById("mapCanvas");
const ctx = canvas.getContext("2d");
const tooltip = document.getElementById("tooltip");
const infoBox = document.getElementById("forecastInfo");

let scale = 1;
let offsetX = 0;
let offsetY = 0;

let dragging = false;
let lastX, lastY;

let cells = [];
let borders = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  if (cells.length) draw();
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

/* ================= BORDERS ================= */

fetch("map/data/borders_lcc.json")
  .then(r => r.json())
  .then(data => {
    borders = data.features;
    draw();
  });

/* ================= NBM DATA ================= */

fetch("map/data/tornado_prob_nbm_lcc.json")
  .then(r => r.json())
  .then(data => {

    const width = data.width;
    const height = data.height;
    const [a,b,c,d,e,f] = data.transform;
    const probs = data.probabilities;

    cells = [];

    for (let i = 0; i < height; i++) {
      for (let j = 0; j < width; j++) {

        const idx = i * width + j;
        const p = probs[idx];

        if (p === null || p === undefined) continue;

        const x = a * j + c;
        const y = e * i + f;

        cells.push({
          x,
          y,
          dx: Math.abs(a),
          dy: Math.abs(e),
          prob: p
        });
      }
    }

    const pad = n => n.toString().padStart(2,"0");

    infoBox.innerHTML =
      `Run: ${data.run_date} ${pad(data.run_hour)}Z (${data.forecast})<br>
       Generated: ${data.generated}`;

    fitView();
    draw();
  });

/* ================= COLOR ================= */

function probToColor(p) {
  if (p < 0.01) return 'white';
  else if (p <= 1) return 'green';
  else if (p <= 2) return 'brown';
  else return 'yellow';
}

/* ================= VIEW ================= */

function fitView() {
  if (!cells.length) return;

  let minX=Infinity,maxX=-Infinity;
  let minY=Infinity,maxY=-Infinity;

  cells.forEach(c=>{
    minX=Math.min(minX,c.x);
    maxX=Math.max(maxX,c.x+c.dx);
    minY=Math.min(minY,c.y);
    maxY=Math.max(maxY,c.y+c.dy);
  });

  borders.forEach(line=>{
    line.forEach(([x,y])=>{
      minX=Math.min(minX,x);
      maxX=Math.max(maxX,x);
      minY=Math.min(minY,y);
      maxY=Math.max(maxY,y);
    });
  });

  const rx=maxX-minX;
  const ry=maxY-minY;

  scale=Math.min(canvas.width/rx,canvas.height/ry)*0.9;

  offsetX=canvas.width/2-(minX+rx/2)*scale;
  offsetY=canvas.height/2+(minY+ry/2)*scale;
}

/* ================= DRAW ================= */

function draw() {
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.setTransform(scale,0,0,-scale,offsetX,offsetY);

  cells.forEach(c=>{
    ctx.fillStyle = probToColor(c.prob);
    ctx.fillRect(c.x,c.y,c.dx,c.dy);
  });

  ctx.strokeStyle = "black";
  ctx.lineWidth = 1/scale;

  ctx.beginPath();

  borders.forEach(line=>{
    line.forEach(([x,y],i)=>{
      if(i===0) ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    });
  });

  ctx.stroke();
}

/* ================= INTERACTION ================= */

function screenToLCC(px,py){
  return {
    x:(px-offsetX)/scale,
    y:-(py-offsetY)/scale
  };
}

canvas.addEventListener("mousemove", e => {

  const {x, y} = screenToLCC(e.offsetX, e.offsetY);

  let hit = null;

  for (const c of cells) {
    if (
      x >= c.x &&
      x <= c.x + c.dx &&
      y >= c.y &&
      y <= c.y + c.dy
    ) {
      hit = c;
      break;
    }
  }

  if (hit) {
    tooltip.style.display = "block";
    tooltip.style.left = (e.pageX + 12) + "px";
    tooltip.style.top = (e.pageY + 12) + "px";

    tooltip.innerHTML =
`<b>Tornado Probability</b><br>
${hit.prob.toFixed(2)} %`;
  } else {
    tooltip.style.display = "none";
  }
});

canvas.addEventListener("wheel",e=>{
  e.preventDefault();

  const z = e.deltaY < 0 ? 1.15 : 0.87;

  offsetX = e.offsetX - z*(e.offsetX-offsetX);
  offsetY = e.offsetY - z*(e.offsetY-offsetY);

  scale *= z;

  draw();
});

canvas.addEventListener("mousedown",e=>{
  dragging=true;
  lastX=e.clientX;
  lastY=e.clientY;
});

window.addEventListener("mouseup",()=>dragging=false);

window.addEventListener("mousemove",e=>{
  if(!dragging) return;

  offsetX += e.clientX-lastX;
  offsetY += e.clientY-lastY;

  lastX=e.clientX;
  lastY=e.clientY;

  draw();
});

</script>

</body>
</html>
