<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>RAP Tornado Probability</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
}

canvas {
    display: block;
}

/* Forecast info box */
#forecast-info {
    position: absolute;
    top: 12px;
    left: 12px;

    background: rgba(0, 0, 0, 0.75);
    color: #ffffff;

    padding: 10px 14px;
    border-radius: 6px;

    font-family: Arial, sans-serif;
    font-size: 13px;
    line-height: 1.4;

    z-index: 1000;
    pointer-events: none;
}

/* Tooltip */
#tooltip {
    position: absolute;

    background: rgba(0,0,0,0.8);
    color: #fff;

    padding: 6px 8px;
    border-radius: 4px;

    font-family: Arial, sans-serif;
    font-size: 12px;

    pointer-events: none;
    display: none;

    z-index: 1001;
}
</style>
</head>


<body>

<div id="forecast-info">Loading forecast...</div>
<div id="tooltip"></div>

<canvas id="map"></canvas>


<script>

const canvas = document.getElementById("map");
const ctx = canvas.getContext("2d");

const tooltip = document.getElementById("tooltip");

let cells = [];
let borders = [];

let scale = 1;
let offsetX = 0;
let offsetY = 0;


/* =============================
   Resize
============================= */

function resize() {

    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;

    draw();
}

window.addEventListener("resize", resize);


/* =============================
   Color Scale
============================= */

function probToColor(p) {

    // Clamp
    p = Math.max(0, Math.min(1, p));

    // Blue -> Red
    const r = Math.floor(255 * p);
    const g = 0;
    const b = Math.floor(255 * (1 - p));

    return `rgb(${r},${g},${b})`;
}


/* =============================
   Projection Helpers
============================= */

function worldToScreen(x, y) {

    return {
        x: x * scale + offsetX,
        y: -y * scale + offsetY
    };
}


/* =============================
   Forecast Label
============================= */

function updateForecastLabel(data) {

    const runDate = data.run_date;
    const runHour = parseInt(data.run_hour);
    const fcst = data.forecast;

    const fcstHour = parseInt(fcst.replace("F",""));

    const year  = runDate.slice(0,4);
    const month = runDate.slice(4,6);
    const day   = runDate.slice(6,8);

    let validStart = runHour + fcstHour;
    let validEnd   = validStart + 1;

    if (validStart >= 24) validStart -= 24;
    if (validEnd   >= 24) validEnd   -= 24;

    const pad = n => String(n).padStart(2,"0");

    const initStr  = `${pad(runHour)}:00 UTC`;
    const validStr = `${pad(validStart)}:00–${pad(validEnd)}:00 UTC`;

    const now = new Date().toUTCString().slice(17,22);

    const label = `
<strong>RAP Tornado Probability</strong><br>
Init: ${initStr}<br>
Valid: ${validStr}<br>
Updated: ${now} UTC
`;

    document.getElementById("forecast-info").innerHTML = label;
}


/* =============================
   Fit View
============================= */

function fitToData() {

    let minX = Infinity;
    let maxX = -Infinity;
    let minY = Infinity;
    let maxY = -Infinity;

    for (const c of cells) {

        minX = Math.min(minX, c.x);
        maxX = Math.max(maxX, c.x);

        minY = Math.min(minY, c.y);
        maxY = Math.max(maxY, c.y);
    }

    const w = maxX - minX;
    const h = maxY - minY;

    const sx = canvas.width  / w;
    const sy = canvas.height / h;

    scale = Math.min(sx, sy) * 0.95;

    offsetX = canvas.width  / 2 - (minX + w/2) * scale;
    offsetY = canvas.height / 2 + (minY + h/2) * scale;
}


/* =============================
   Draw
============================= */

function draw() {

    ctx.clearRect(0,0,canvas.width,canvas.height);

    /* Borders */

    ctx.strokeStyle = "white";
    ctx.lineWidth = 1;

    for (const poly of borders) {

        ctx.beginPath();

        poly.forEach((p, i) => {

            const s = worldToScreen(p[0], p[1]);

            if (i === 0) ctx.moveTo(s.x, s.y);
            else ctx.lineTo(s.x, s.y);
        });

        ctx.stroke();
    }


    /* Cells */

    for (const c of cells) {

        const s = worldToScreen(c.x, c.y);

        const w = c.dx * scale;
        const h = c.dy * scale;

        ctx.fillStyle = probToColor(c.prob);

        ctx.fillRect(
            s.x - w/2,
            s.y - h/2,
            w,
            h
        );
    }
}


/* =============================
   Tooltip
============================= */

canvas.addEventListener("mousemove", e => {

    const mx = e.clientX;
    const my = e.clientY;

    let found = null;

    for (const c of cells) {

        const s = worldToScreen(c.x, c.y);

        const w = c.dx * scale;
        const h = c.dy * scale;

        if (
            mx >= s.x - w/2 &&
            mx <= s.x + w/2 &&
            my >= s.y - h/2 &&
            my <= s.y + h/2
        ) {
            found = c;
            break;
        }
    }

    if (found) {

        const pct = (found.prob * 100).toFixed(4);

        tooltip.innerHTML =
            `Probability: <b>${pct}%</b>`;

        tooltip.style.left = (mx + 12) + "px";
        tooltip.style.top  = (my + 12) + "px";

        tooltip.style.display = "block";

    } else {

        tooltip.style.display = "none";
    }
});


canvas.addEventListener("mouseleave", () => {
    tooltip.style.display = "none";
});


/* =============================
   Load Data
============================= */

Promise.all([

    fetch("map/data/tornado_prob_lcc.json").then(r=>r.json()),
    fetch("map/data/borders_lcc.json").then(r=>r.json())

]).then(([grid, borderData]) => {

    cells = grid.features;

    borders = borderData.features.map(f =>
        f.geometry.coordinates[0]
    );

    updateForecastLabel(grid);

    fitToData();
    resize();

}).catch(err => {
    console.error(err);
});


</script>

</body>
</html>
