<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tornado Grid</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #000;
  font-family: system-ui, -apple-system, Arial, sans-serif;
}

/* subtle atmospheric grid background */
body::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;

  background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);

  background-size: 40px 40px;
  z-index: 0;
}

canvas {
  display: block;
  position: relative;
  z-index: 1;
}

/* TOP INFO */
#forecastInfo {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 10;

  color: rgba(255,255,255,0.85);
  font-size: 12px;
  line-height: 1.4;

  text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  pointer-events: none;
}

/* BRAND */
#brand {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 20;

  display: flex;
  align-items: center;
  gap: 8px;

  color: rgba(255,255,255,0.8);
  font-size: 12px;
  letter-spacing: 2px;
  pointer-events: none;
}

#mark {
  width: 14px;
  height: 14px;

  background-image:
    linear-gradient(to right, rgba(255,255,255,0.6) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,0.6) 1px, transparent 1px);

  background-size: 4px 4px;
  opacity: 0.8;
}

/* TOOLTIP */
#tooltip {
  position: absolute;
  padding: 6px 8px;
  background: rgba(0,0,0,0.92);
  border: 1px solid rgba(255,255,255,0.15);
  color: white;

  font-size: 12px;
  white-space: nowrap;

  pointer-events: none;
  display: none;
  z-index: 30;
}

/* LEGEND */
#legend {
  position: absolute;
  bottom: 10px;
  left: 10px;
  z-index: 20;

  font-size: 11px;
  color: rgba(255,255,255,0.65);
  line-height: 1.6;

  pointer-events: none;
}

.legend-line::before {
  content: "■";
  margin-right: 6px;
}
</style>
</head>

<body>

<!-- BRAND -->
<div id="brand">
  <div id="mark"></div>
  <div>TORNADO GRID</div>
</div>

<!-- INFO -->
<div id="forecastInfo">Loading Tornado Grid…</div>

<!-- LEGEND -->
<div id="legend">
  <div class="legend-line">WHITE — &lt;0.1% background</div>
  <div class="legend-line">GREEN — 0.1–1% weak</div>
  <div class="legend-line">BROWN — 1–2% enhanced</div>
  <div class="legend-line">YELLOW — &gt;2% significant</div>
</div>

<canvas id="mapCanvas"></canvas>
<div id="tooltip"></div>

<script>

const canvas = document.getElementById("mapCanvas");
const ctx = canvas.getContext("2d");
const tooltip = document.getElementById("tooltip");
const infoBox = document.getElementById("forecastInfo");

let scale = 1;
let offsetX = 0;
let offsetY = 0;

let dragging = false;
let lastX, lastY;

let cells = [];
let borders = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

/* LOAD BORDERS */
fetch("map/data/borders_lcc.json")
  .then(r => r.json())
  .then(data => {
    borders = data.features;
    fitView();
    draw();
  });

/* LOAD FORECAST */
fetch("map/data/tornado_prob_lcc.json")
  .then(r => r.json())
  .then(data => {

    cells = data.features;

    const runDate = data.run_date;
    const runHour = parseInt(data.run_hour,10);
    const fcst = data.forecast;

    const fcstHour = runHour + 1;
    const validStart = fcstHour % 24;
    const validEnd = (fcstHour + 1) % 24;

    function pad(n){return n.toString().padStart(2,"0");}

    infoBox.innerHTML =
`<b>Tornado Grid</b><br>
Probabilistic convective field<br><br>
Run: ${runDate} ${pad(runHour)}Z<br>
Valid: ${pad(validStart)}–${pad(validEnd)} UTC`;

    fitView();
    draw();
  });

function probToColor(p) {
  if (p < 0.001) return 'white';
  else if (p <= 0.01) return 'green';
  else if (p <= 0.02) return 'brown';
  else return 'yellow';
}

function fitView() {

  if (cells.length === 0) return;

  let minX=Infinity,maxX=-Infinity;
  let minY=Infinity,maxY=-Infinity;

  cells.forEach(c=>{
    minX=Math.min(minX,c.x);
    maxX=Math.max(maxX,c.x+c.dx);
    minY=Math.min(minY,c.y);
    maxY=Math.max(maxY,c.y+c.dy);
  });

  borders.forEach(line=>{
    line.forEach(([x,y])=>{
      minX=Math.min(minX,x);
      maxX=Math.max(maxX,x);
      minY=Math.min(minY,y);
      maxY=Math.max(maxY,y);
    });
  });

  const rx=maxX-minX;
  const ry=maxY-minY;

  scale=Math.min(canvas.width/rx,canvas.height/ry)*0.9;

  offsetX=canvas.width/2-(minX+rx/2)*scale;
  offsetY=canvas.height/2+(minY+ry/2)*scale;
}

function draw(){

  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.setTransform(scale,0,0,-scale,offsetX,offsetY);

  cells.forEach(c=>{
    ctx.fillStyle=probToColor(c.prob);
    ctx.fillRect(c.x,c.y,c.dx,c.dy);
  });

  ctx.strokeStyle="black";
  ctx.lineWidth=1/scale;

  ctx.beginPath();

  borders.forEach(line=>{
    line.forEach(([x,y],i)=>{
      if(i===0) ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    });
  });

  ctx.stroke();
}

function screenToLCC(px,py){
  return {
    x:(px-offsetX)/scale,
    y:-(py-offsetY)/scale
  };
}

/* TOOLTIP */
canvas.addEventListener("mousemove", e => {

  const {x, y} = screenToLCC(e.offsetX, e.offsetY);

  let hit = null;

  for (const c of cells) {
    if (x >= c.x && x <= c.x + c.dx && y >= c.y && y <= c.y + c.dy) {
      hit = c;
      break;
    }
  }

  if (hit) {

    tooltip.style.display = "block";
    tooltip.style.left = (e.pageX + 12) + "px";
    tooltip.style.top = (e.pageY + 12) + "px";

    tooltip.innerHTML =
`<b>${(hit.prob * 100).toFixed(3)}%</b><br>
CAPE: ${hit.cape ?? 0}<br>
CIN: ${hit.cin ?? 0}<br>
SRH: ${hit.hlcy ?? 0}<br>
LCL: ${hit.lcl ?? 0}<br>
Shear: ${hit.shear ?? 0}`;

  } else {
    tooltip.style.display = "none";
  }

});

/* ZOOM */
canvas.addEventListener("wheel",e=>{
  e.preventDefault();

  const z=e.deltaY<0?1.15:0.87;

  offsetX=e.offsetX-z*(e.offsetX-offsetX);
  offsetY=e.offsetY-z*(e.offsetY-offsetY);

  scale*=z;
  draw();
});

/* PAN */
canvas.addEventListener("mousedown",e=>{
  dragging=true;
  lastX=e.clientX;
  lastY=e.clientY;
});

window.addEventListener("mouseup",()=>dragging=false);

window.addEventListener("mousemove",e=>{
  if(!dragging) return;

  offsetX+=e.clientX-lastX;
  offsetY+=e.clientY-lastY;

  lastX=e.clientX;
  lastY=e.clientY;

  draw();
});

</script>

</body>
</html>
